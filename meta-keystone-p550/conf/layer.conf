BBPATH =. "${LAYERDIR}:"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "keystone-p550"
BBFILE_PATTERN_keystone-p550 = "^${LAYERDIR}/"
BBFILE_PRIORITY_keystone-p550 = "9"

LAYERVERSION_keystone-p550 = "1"
LAYERSERIES_COMPAT_keystone-p550 = "walnascar"
LAYERDEPENDS_keystone-p550 = "core meta-sifive"
